<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USDJPY Judge</title><style>body{margin:0;background:#0b1424;color:#eef4ff;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:700px;margin:auto;padding:18px}.card{background:#16263d;border:1px solid #30445f;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.small{font-size:12px;color:#a9bbd2}.big{font-size:34px;font-weight:700}.value{font-size:20px;font-weight:650;margin:7px 0}.green{color:#54e5a8}.red{color:#ff8282}.yellow{color:#ffd074}button,input,select{font:inherit;border-radius:8px;padding:9px}button{border:0;background:#3276d4;color:white}input,select{width:100%;box-sizing:border-box;background:#091a2b;color:white;border:1px solid #48607a;margin:5px 0 10px}.position{border-top:1px solid #354c69;padding-top:12px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:21px}h2{font-size:16px;margin:0 0 12px}label{font-size:12px;color:#b4c7db}</style><main><div class="row"><h1>USDJPY JUDGE <span class="small">WEB v1.0</span></h1><span id="status" class="yellow">接続中</span></div><div class="card"><div class="small">USDJPY 最新受信価格</div><div class="row"><div class="big" id="price">---.---</div><button onclick="load()">更新</button></div><div class="small" id="updated">データ取得待ち</div></div><div class="card"><div class="small">SCALP</div><div class="big" id="scalp">---</div><div class="small">EARLY SIGNAL</div><div class="value" id="early">---</div><div class="grid"><div><div class="small">DAY</div><div class="value" id="day">---</div></div><div><div class="small">SWING</div><div class="value" id="swing">---</div></div></div></div><div class="card"><h2>時間足</h2><div class="grid" id="tfs"></div></div><div class="card"><h2>リスク・構造</h2><div class="grid" id="risk"></div></div><div class="card"><h2>EMA</h2><div class="grid" id="ema"></div></div><div class="card"><div class="row"><h2>ポジション監視（最大5件）</h2><button onclick="add()">＋追加</button></div><div class="small">この端末に保存。方向別リスクは参考情報であり、含み損益や証拠金維持率ではありません。</div><div id="positions"></div></div><div class="small">15秒ごとに更新。LIVEは直近3分以内の受信を意味します。注文・損切りはブローカー側で管理してください。</div></main><script>
const API='https://usdjpy-judge-webhook.stmm-casting92.workers.dev/';let data=null;let positions=[];try{positions=JSON.parse(localStorage.getItem('usdjpy_positions')||'[]')}catch{}const el=id=>document.getElementById(id);const fmt=(v,n=3)=>typeof v==='number'?v.toFixed(n):'---';const color=s=>/LONG|NORMAL/.test(s)?'green':/SHORT|DANGER|CRITICAL/.test(s)?'red':'yellow';function item(k,v){return '<div><div class="small">'+k+'</div><div class="value '+color(String(v))+'">'+(v??'---')+'</div></div>'}function save(){localStorage.setItem('usdjpy_positions',JSON.stringify(positions))}function add(){if(positions.length>=5)return alert('最大5件です');positions.push({side:'LONG',entry:'',sl:''});save();renderPositions()}function renderPositions(){el('positions').innerHTML=positions.map((p,i)=>'<div class="position"><div class="row"><b>POSITION '+(i+1)+'</b><button onclick="remove('+i+')">削除</button></div><div class="grid"><label>方向<select onchange="change('+i+',\'side\',this.value)"><option '+(p.side==='LONG'?'selected':'')+'>LONG</option><option '+(p.side==='SHORT'?'selected':'')+'>SHORT</option></select></label><label>建値<input type="number" step="0.001" value="'+p.entry+'" onchange="change('+i+',\'entry\',this.value)"></label><label>SL<input type="number" step="0.001" value="'+p.sl+'" onchange="change('+i+',\'sl\',this.value)"></label><div><div class="small">方向別リスク</div><div class="value '+color(data?.[p.side==='LONG'?'long_risk':'short_risk']||'')+'">'+(data?.[p.side==='LONG'?'long_risk':'short_risk']||'---')+'</div></div></div><div class="small">建値との差: '+(data&&Number(p.entry)>0?fmt((data.price-Number(p.entry))*(p.side==='LONG'?1:-1)*100,1)+' pips':'---')+'</div></div>').join('')}function remove(i){positions.splice(i,1);save();renderPositions()}function change(i,k,v){positions[i][k]=v;save();renderPositions()}function render(d){data=d;el('price').textContent=fmt(d.price);for(const k of ['scalp','early','day','swing']){el(k).textContent=d[k]||'---';el(k).className=(k==='scalp'?'big ':'value ')+color(d[k]||'')}el('tfs').innerHTML=[['1M','tf_1m'],['5M','tf_5m'],['15M','tf_15m'],['1H','tf_1h'],['4H','tf_4h'],['1D','tf_1d']].map(([a,b])=>item(a,d[b])).join('');el('risk').innerHTML=[['LONG RISK','long_risk'],['SHORT RISK','short_risk'],['BREAK / RETEST','break_state'],['ADX14','adx14'],['ATR14','atr14'],['構造安値','structure_low'],['構造高値','structure_high']].map(([a,b])=>item(a,typeof d[b]==='number'?fmt(d[b],b==='atr14'?5:3):d[b])).join('');el('ema').innerHTML=[20,75,200,700].map(n=>item('EMA'+n,fmt(d['ema'+n]))).join('');renderPositions()}async function load(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||'API');if(j.latest)render(j.latest);const t=j.latest?.received_at||j.updated_at;const age=t?(Date.now()-Date.parse(t))/1000:Infinity;el('updated').textContent=t?'最終受信 '+new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST':'TradingView受信待ち';el('status').textContent=!j.latest?'WAITING':age<=180&&age>=-60?'LIVE':'STALE';el('status').className=age<=180&&age>=-60?'green':'yellow'}catch(e){el('status').textContent='OFFLINE';el('status').className='red';el('updated').textContent='取得エラー: '+e.message}}renderPositions();load();setInterval(load,15000);
</script></html>
