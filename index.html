<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091525"><title>TRADE MONITOR</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#091525;color:#eef4ff}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:18px 14px 90px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 20px}h1{font-size:23px;letter-spacing:.05em;margin:0}h2{font-size:20px;margin:0}small,.muted{color:#9eb2ca}.muted{font-size:12px}.card{background:#15253c;border:1px solid #30435f;border-radius:18px;padding:17px;margin:13px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-size:32px;font-weight:750;margin:14px 0 5px;font-variant-numeric:tabular-nums}.signal{font-size:24px;font-weight:750}.pill{padding:5px 9px;border-radius:30px;background:#2d3c53;font-size:11px;font-weight:700}.good{color:#45e2a4}.bad{color:#ff7d82}.warn{color:#ffd070}.neutral{color:#b6c7dd}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}.grid>div{background:#0e1d31;border-radius:10px;padding:10px 8px;min-width:0}.grid strong{display:block;font-size:14px;margin-top:6px;overflow-wrap:anywhere}.label{font-size:11px;color:#a4b6cc}button,a.btn{display:inline-block;background:#2869bc;border:0;border-radius:10px;padding:11px 14px;color:white;text-decoration:none;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:#30445f}button:disabled{opacity:.5}.actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.actions>*{flex:1;text-align:center}.note{font-size:12px;line-height:1.6;color:#a4b6cc}.settings{display:none}.settings.open{display:block}label{display:block;color:#b9c9dc;font-size:12px;margin-top:14px}input{display:block;width:100%;margin-top:5px;border:1px solid #405675;background:#0a192b;border-radius:9px;padding:12px;color:#fff;font-size:14px}hr{border:0;border-top:1px solid #30435f;margin:18px 0}.status-line{font-size:12px;color:#a9bad1;margin-top:6px}.footer{text-align:center;font-size:11px;color:#839ab6;line-height:1.7;margin-top:25px}@media(max-width:370px){.price{font-size:27px}.grid strong{font-size:12px}h1{font-size:20px}}
</style></head><body><main><div class="header"><div><h1>TRADE MONITOR</h1><div class="muted">BTCUSD · XAUUSD · USDJPY / v1.1</div></div><button id="settingsToggle" class="secondary">⚙ 設定</button></div><div class="row"><div class="muted" id="overall">接続確認中…</div><button id="refresh" class="secondary">↻ 更新</button></div><section id="settings" class="card settings"><h2>接続先の設定</h2><p class="note">Worker URLは末尾「/」までのHTTPS URLを入力してください。各アプリへのリンクも変更できます。設定はこの端末内だけに保存されます。</p><div id="settingsFields"></div><div class="actions"><button id="save">設定を保存して更新</button><button id="close" class="secondary">閉じる</button></div></section><div id="cards"></div><p class="footer">15秒ごとにデータ取得。LIVEは受信後180秒以内の目安です。通信が正常でも相場判断の正確性を保証するものではありません。注文・損切りは取引口座側で管理してください。</p></main><script>
'use strict';
const defaults={
 BTCUSD:{api:'https://btc-judge-webhook.stmm-casting92.workers.dev/',app:'https://stmmcasting92-ux.github.io/btcusd-trade-judge/'},
 XAUUSD:{api:'',app:''},
 USDJPY:{api:'https://usdjpy-judge-webhook.stmm-casting92.workers.dev/',app:'https://stmmcasting92-ux.github.io/usdjpy-judge/'}
};
const names=['BTCUSD','XAUUSD','USDJPY'];
let config=structuredClone(defaults);try{const saved=JSON.parse(localStorage.getItem('trade_monitor_config')||'{}');for(const n of names){if(saved[n])config[n]={...config[n],...saved[n]}}}catch{}
const $=id=>document.getElementById(id);const safe=(v)=>v==null?'---':String(v);const fmt=(v,d)=>Number.isFinite(Number(v))&&v!==null&&v!==''?Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'---';
function textNode(el,s){el.textContent=safe(s)}
function color(v){const s=safe(v).toUpperCase();return /CRITICAL|DANGER|SHORT|DOWN|OFFLINE/.test(s)?'bad':/LONG|NORMAL|UP|LIVE/.test(s)?'good':/WAIT|CAUTION|STALE|EARLY/.test(s)?'warn':'neutral'}
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)textNode(e,txt);return e}
function makeCard(n){const c=node('section','card');c.id='card-'+n;const top=node('div','row');top.append(node('h2','',n),node('span','pill','CONNECTING'));c.append(top);c.append(node('div','price','---'));const line=node('div','row');line.append(node('div','signal neutral','---'),node('div','muted',''));c.append(line);const grid=node('div','grid');for(const label of ['RISK','SECONDARY','RECEIVED']){const box=node('div');box.append(node('span','label',label),node('strong','neutral','---'));grid.append(box)}c.append(grid);c.append(node('div','status-line','データ取得待ち'));const actions=node('div','actions');const link=node('a','btn','Judgeアプリを開く ↗');link.target='_blank';link.rel='noopener noreferrer';link.href='#';actions.append(link);c.append(actions);return c}
for(const n of names)$('cards').append(makeCard(n));
function getSignal(n,data){if(n==='USDJPY')return safe(data.scalp);if(n==='XAUUSD')return safe(data.judge);const judge=data.BTCJUDGE||data.BTCFLASH||data.FLASHJUDGE||{};return safe(judge.judge||judge.final||judge.signal||judge.direction||data.judge||'---')}
function getPrice(n,data){if(n==='BTCUSD'){const j=data.BTCJUDGE||data.BTCFLASH||{};return j.price??j.current_price??data.price}return data.price??data.current_price}
function getRisk(n,data){if(n==='USDJPY')return 'L '+safe(data.long_risk)+' / S '+safe(data.short_risk);if(n==='XAUUSD')return safe(data.risk||data.risk_level||'—');const j=data.BTCJUDGE||{};return safe(j.risk||j.risk_level||data.risk||'—')}
function getSecondary(n,data){if(n==='USDJPY')return 'EARLY '+safe(data.early)+' · DAY '+safe(data.day);if(n==='XAUUSD')return safe(data.reason||data.environment||'—');const j=data.BTCJUDGE||{};return safe(j.reason||j.environment||j.status||'—')}
function received(n,root,data){if(n==='BTCUSD'){const j=data.BTCJUDGE||{};return j.received_at||j.updated_at||j.updated||root.updated||root.updated_at||data.received_at}return data.received_at||root.updated_at||data.updated_at||root.updated}
function show(n,mode,data,root,error){const card=$('card-'+n),pill=card.querySelector('.pill'),price=card.querySelector('.price'),signal=card.querySelector('.signal'),secondary=card.querySelector('.row .muted'),vals=card.querySelectorAll('.grid strong'),line=card.querySelector('.status-line'),link=card.querySelector('a');pill.textContent=mode;pill.className='pill '+color(mode);link.href=config[n].app||'#';link.style.pointerEvents=config[n].app?'auto':'none';link.style.opacity=config[n].app?'1':'.45';if(!data){price.textContent='---';signal.textContent='---';secondary.textContent='';vals.forEach(x=>x.textContent='---');line.textContent=error||'データ未受信';return}
price.textContent=fmt(getPrice(n,data),n==='BTCUSD'?2:n==='XAUUSD'?2:3);const s=getSignal(n,data);signal.textContent=s;signal.className='signal '+color(s);secondary.textContent=getSecondary(n,data);vals[0].textContent=getRisk(n,data);vals[0].className=color(vals[0].textContent);vals[1].textContent=n==='USDJPY'?safe(data.swing):n==='XAUUSD'?safe(data.trend_1h||data.trend1h||data.environment||'—'):safe((data.BTCJUDGE||{}).direction||'—');const t=received(n,root,data),date=t?new Date(t):null;vals[2].textContent=date&&!isNaN(date)?date.toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'不明';line.textContent=date&&!isNaN(date)?'最終受信 '+date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' JST':'受信時刻を判定できません';}
let busy=false;async function refresh(){if(busy)return;busy=true;const result=await Promise.all(names.map(async n=>{const api=config[n].api;if(!api){show(n,'未設定',null,{},'設定からWorker URLを登録してください');return false}try{const u=new URL(api);if(u.protocol!=='https:')throw Error('HTTPS URLを指定してください');u.searchParams.set('_',Date.now());const response=await fetch(u.toString(),{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!response.ok)throw Error('HTTP '+response.status);const root=await response.json();if(root.ok===false)throw Error(root.error||'Worker error');let data=n==='BTCUSD'?root:(root.latest||null);if(n==='BTCUSD'&&root.latest)data=root.latest;const exists=n==='BTCUSD'?Boolean(data.BTCJUDGE||data.price||data.BTCFLASH):Boolean(data);if(!exists){show(n,'WAITING',null,root,'TradingViewの初回受信待ち');return false}const t=received(n,root,data),dt=t?Date.parse(t):NaN;const age=(Date.now()-dt)/1000;const mode=Number.isFinite(age)&&age>=-60&&age<=180?'LIVE':'STALE';show(n,mode,data,root);return mode==='LIVE'}catch(e){show(n,'OFFLINE',null,{},'取得できません: '+e.message);return false}}));$('overall').textContent='LIVE '+result.filter(Boolean).length+' / 3 · '+new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'});busy=false}
const fields=$('settingsFields');for(const n of names){const group=node('div');group.append(node('h3','',n));for(const [key,label] of [['api','Worker URL'],['app','JudgeアプリURL']]){const l=node('label','',label);const inp=node('input');inp.type='url';inp.id=n+'-'+key;inp.value=config[n][key];inp.placeholder='https://...';l.append(inp);group.append(l)}fields.append(group);fields.append(node('hr'))}
$('settingsToggle').onclick=()=>{const panel=$('settings');const opened=panel.classList.toggle('open');$('settingsToggle').textContent=opened?'✕ 設定を閉じる':'⚙ 設定';$('settingsToggle').setAttribute('aria-expanded',String(opened));if(opened)panel.scrollIntoView({behavior:'smooth',block:'start'});};$('close').onclick=()=>{$('settings').classList.remove('open');$('settingsToggle').textContent='⚙ 設定';};$('save').onclick=()=>{for(const n of names){for(const key of ['api','app']){const value=$(n+'-'+key).value.trim();if(value){try{if(new URL(value).protocol!=='https:')throw Error()}catch{alert(n+' の '+key+' は有効なHTTPS URLを指定してください');return}}config[n][key]=value}}localStorage.setItem('trade_monitor_config',JSON.stringify(config));$('settings').classList.remove('open');$('settingsToggle').textContent='⚙ 設定';refresh()};$('refresh').onclick=refresh;refresh();setInterval(refresh,15000);
</script></body></html>
